<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kore_ai | Phygital Automation per Ristoranti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0e0f12; overflow-x: hidden; }

        .landing-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        .landing-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .clickable-card {
            display: block;
            text-decoration: none;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background-color: #25D366;
            color: #000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- Notare la 'S' maiuscola nei nomi dei file per combaciare con i tuoi file -->
        <img src="Scheda1.jpg" alt="Scheda 1">
        <img src="Scheda2.jpg" alt="Scheda 2">
        
        <a href="https://wa.me/393345946100?text=Ciro%20mandami%20più%20info" class="clickable-card" target="_blank">
            <img src="Scheda3.jpg" alt="Scheda 3">
        </a>
    </div>

    <!-- Pulsante WhatsApp Fisso -->
    <a href="https://wa.me/393345946100?text=Ciro%20mandami%20più%20info" class="whatsapp-float" target="_blank">
        💬 RICHIEDI INFO SU WHATSAPP
    </a>

</body>
</html>
