<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kore_ai | Marketing Automatico per Ristoranti - Come Avere Più Clienti</title>
    <meta name="description" content="Scopri come riempire i tavoli vuoti del tuo ristorante nei giorni morti in automatico. Aumenta fatturato e clienti con il Phygital Marketing su WhatsApp.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0e0f12; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            height: 100vh;
        }

        .carousel-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }

        .slide {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #0e0f12;
        }

        .clickable-card {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Pallini di Navigazione */
        .nav-dot {
            position: fixed;
            bottom: 30px;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .nav-dot:active {
            transform: scale(0.9);
        }

        .prev-dot {
            left: 20px;
            opacity: 0;
            pointer-events: none;
        }

        .next-dot {
            right: 20px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.25); }
            50% { transform: scale(1.1); box-shadow: 0 0 18px 5px rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.25); }
        }

        /* Pallino Musica (In alto a destra) */
        .music-dot {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .music-dot.playing {
            background: #25D366;
            border-color: #25D366;
            color: #000;
            animation: musicPulse 1.5s infinite ease-in-out;
        }

        @keyframes musicPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Traccia audio diretta con link CDN ad alta stabilità -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=smooth-acoustics-11158.mp3" type="audio/mpeg">
    </audio>

    <!-- Pallino Musica in alto a destra -->
    <div class="music-dot" id="musicBtn" onclick="toggleMusic()">🔇</div>

    <div class="carousel-container" id="carousel">
        <!-- Scheda 1 -->
        <div class="slide" id="slide1">
            <img src="Scheda1.jpg" alt="Scheda 1">
        </div>
        
        <!-- Scheda 2 -->
        <div class="slide" id="slide2">
            <img src="Scheda2.jpg" alt="Scheda 2">
        </div>
        
        <!-- Scheda 3: Cliccabile verso WhatsApp -->
        <div class="slide" id="slide3">
            <a href="https://wa.me/393345946100?text=Ciro%20mandami%20più%20info" class="clickable-card" target="_blank">
                <img src="Scheda3.jpg" alt="Scheda 3">
            </a>
        </div>
    </div>

    <!-- Pallino INDIETRO (Sinistra) -->
    <div class="nav-dot prev-dot" id="prevBtn" onclick="prevSlide()">➔</div>

    <!-- Pallino AVANTI (Destra) -->
    <div class="nav-dot next-dot" id="nextBtn" onclick="nextSlide()">➔</div>

    <script>
        const carousel = document.getElementById('carousel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        
        prevBtn.style.transform = "rotate(180deg)";
        bgMusic.volume = 0.5;

        let currentSlide = 0;
        const totalSlides = 3;
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = "🎶";
                }).catch(error => {
                    console.log("Riproduzione impedita:", error);
                });
            } else {
                bgMusic.pause();
                isPlaying = false;
                musicBtn.classList.remove('playing');
                musicBtn.innerHTML = "🔇";
            }
        }

        function updateUI() {
            if (currentSlide > 0) {
                prevBtn.style.opacity = "1";
                prevBtn.style.pointerEvents = "auto";
            } else {
                prevBtn.style.opacity = "0";
                prevBtn.style.pointerEvents = "none";
            }

            if (currentSlide === totalSlides - 1) {
                nextBtn.style.opacity = "0";
                nextBtn.style.pointerEvents = "none";
            } else {
                nextBtn.style.opacity = "1";
                nextBtn.style.pointerEvents = "auto";
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                scrollToSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                scrollToSlide(currentSlide);
            }
        }

        function scrollToSlide(index) {
            carousel.scrollTo({
                left: index * window.innerWidth,
                behavior: 'smooth'
            });
            updateUI();
        }

        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            if (index !== currentSlide) {
                currentSlide = index;
                updateUI();
            }
        });

        updateUI();
    </script>

</body>
</html>
