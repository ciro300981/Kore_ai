<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kore_ai | Phygital Automation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0e0f12; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            height: 100vh;
        }

        /* Contenitore principale a scorrimento orizzontale */
        .carousel-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }

        .slide {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #0e0f12;
        }

        .clickable-card {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Stile base dei Pallini di Navigazione */
        .nav-dot {
            position: fixed;
            bottom: 30px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .nav-dot:active {
            transform: scale(0.9);
        }

        /* Pallino INDIETRO (Basso a Sinistra) */
        .prev-dot {
            left: 20px;
            opacity: 0;
            pointer-events: none; /* Nascosto nella prima scheda */
        }

        /* Pallino AVANTI (Basso a Destra) con Animazione Lampeggiante */
        .next-dot {
            right: 20px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Effetto Lampeggiante / Pulsante */
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
                background: rgba(255, 255, 255, 0.2);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 15px 4px rgba(255, 255, 255, 0.6);
                background: rgba(255, 255, 255, 0.45);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
                background: rgba(255, 255, 255, 0.2);
            }
        }

        /* Pulsante WhatsApp - Visibile SOLO sull'ultima scheda */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background-color: #25D366;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .whatsapp-float.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="carousel-container" id="carousel">
        <!-- Scheda 1 -->
        <div class="slide" id="slide1">
            <img src="Scheda1.jpg" alt="Scheda 1">
        </div>
        
        <!-- Scheda 2 -->
        <div class="slide" id="slide2">
            <img src="Scheda2.jpg" alt="Scheda 2">
        </div>
        
        <!-- Scheda 3: Cliccabile verso WhatsApp -->
        <div class="slide" id="slide3">
            <a href="https://wa.me/393345946100?text=Ciro%20mandami%20più%20info" class="clickable-card" target="_blank">
                <img src="Scheda3.jpg" alt="Scheda 3">
            </a>
        </div>
    </div>

    <!-- Pallino INDIETRO (Sinistra) -->
    <div class="nav-dot prev-dot" id="prevBtn" onclick="prevSlide()">➔</div>

    <!-- Pallino AVANTI (Destra, Lampeggiante) -->
    <div class="nav-dot next-dot" id="nextBtn" onclick="nextSlide()">➔</div>

    <!-- Pulsante WhatsApp (Appare solo sulla 3a scheda) -->
    <a href="https://wa.me/393345946100?text=Ciro%20mandami%20più%20info" class="whatsapp-float" id="waBtn" target="_blank">
        💬 RICHIEDI INFO SU WHATSAPP
    </a>

    <script>
        const carousel = document.getElementById('carousel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const waBtn = document.getElementById('waBtn');
        
        // Ruota l'icona della freccia a sinistra per il tasto indietro
        prevBtn.style.transform = "rotate(180deg)";

        let currentSlide = 0;
        const totalSlides = 3;

        function updateUI() {
            // Gestione visibilità tasto Indietro
            if (currentSlide > 0) {
                prevBtn.style.opacity = "1";
                prevBtn.style.pointerEvents = "auto";
            } else {
                prevBtn.style.opacity = "0";
                prevBtn.style.pointerEvents = "none";
            }

            // Gestione visibilità tasto Avanti e Barra WhatsApp nell'ultima scheda
            if (currentSlide === totalSlides - 1) {
                nextBtn.style.opacity = "0";
                nextBtn.style.pointerEvents = "none";
                waBtn.classList.add('visible');
            } else {
                nextBtn.style.opacity = "1";
                nextBtn.style.pointerEvents = "auto";
                waBtn.classList.remove('visible');
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                scrollToSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                scrollToSlide(currentSlide);
            }
        }

        function scrollToSlide(index) {
            carousel.scrollTo({
                left: index * window.innerWidth,
                behavior: 'smooth'
            });
            updateUI();
        }

        // Rileva lo scorrimento/swipe con il dito
        carousel.addEventListener('scroll', () => {
            const index = Math.round(carousel.scrollLeft / window.innerWidth);
            if (index !== currentSlide) {
                currentSlide = index;
                updateUI();
            }
        });

        // Inizializza stato UI
        updateUI();
    </script>

</body>
</html>
